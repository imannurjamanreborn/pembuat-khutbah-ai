<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhatibAI - Pembuat Khutbah Otomatis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .khutbah-output { background-color: #fff; border-left: 5px solid #198754; padding: 20px; white-space: pre-line; }
        
        /* PERBAIKAN TOTAL MODE CETAK */
        @media print {
            .text-center.mb-5, .col-md-5, .btn-outline-secondary, .btn-primary, .btn-dark {
                display: none !important;
            }
            
            body {
                background-color: #fff !important;
            }

            #output {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
                border-left: none !important;
                font-size: 14pt;
                line-height: 1.8;
                color: #000;
                white-space: pre-line;
                background-color: #fff !important;
            }
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold text-success">🕌 KhatibAI</h1>
        <p class="text-muted">Generator Khutbah Otomatis Berbasis Rukun & Syariat</p>
    </div>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="card p-4">
                <h4 class="mb-3 text-secondary">Pengaturan Khutbah</h4>
                
                <div class="mb-3">
                    <label class="form-label" style="font-weight: bold;">Jenis Acara / Khutbah</label>
                    <select id="category" class="form-select">
                        <option value="jumat" selected>Khutbah Jumat</option>
                        <option value="idul_fitri">Khutbah Idul Fitri</option>
                        <option value="idul_adha">Khutbah Idul Adha</option>
                        <option value="nikah">Khutbah Nikah</option>
                        <option value="ceramah">Ceramah Umum / Kultum</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tema / Topik Khutbah</label>
                    <input type="text" id="topic" class="form-control" placeholder="Contoh: Ketakwaan, Silaturahmi">
                </div>

                <div class="mb-3">
                    <label class="form-label">Durasi Khutbah</label>
                    <select id="duration" class="form-select">
                        <option value="pendek">Pendek (7 - 10 Menit)</option>
                        <option value="sedang" selected>Sedang (10 - 15 Menit)</option>
                        <option value="panjang">Panjang (15 - 20 Menit)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Bahasa Pengantar (Isi)</label>
                    <select id="language" class="form-select">
                        <option value="Indonesia yang santun dan menyentuh hati" selected>Bahasa Indonesia (Santun)</option>
                        <option value="Jawa Kromo (Alus)">Bahasa Jawa (Kromo Alus)</option>
                        <option value="Sunda Lemes">Bahasa Sunda (Lemes)</option>
                    </select>
                </div>

                <button onclick="generateKhutbah()" class="btn btn-success w-100 fw-bold py-2">BUAT ✨</button>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="text-secondary m-0">Naskah Khutbah</h4>
                    <div>
                        <button onclick="copyToClipboard()" class="btn btn-outline-secondary btn-sm">Salin Teks</button>
                        <button onclick="printKhutbah()" class="btn btn-primary btn-sm">Cetak / PDF 🖨️</button>
                        <button onclick="bukaTeleprompter()" class="btn btn-dark btn-sm">Mode Mimbar 📱</button>
                    </div>
                </div>
                
                <div id="output" class="khutbah-output text-muted">
                    Silakan masukkan tema dan klik "BUAT ✨" untuk membuat teks otomatis.
                </div>
            </div>
        </div>
    </div>
</div>

<div id="prompterOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #111; color: #fff; z-index: 9999; overflow-y: scroll; padding: 40px 20px;">
    <div style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(33,37,41,0.95); padding: 10px 20px; border-radius: 30px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10000; border: 1px solid #444;">
        <button onclick="tutupTeleprompter()" class="btn btn-danger btn-sm fw-bold">Keluar ✕</button>
        <button id="btnPlayPause" onclick="toggleScroll()" class="btn btn-success btn-sm fw-bold">Mulai ▶</button>
        <button onclick="ubahKecepatan(-1)" class="btn btn-secondary btn-sm">- Lambat</button>
        <span id="speedIndicator" style="font-size: 11pt; min-width: 65px; text-align: center; font-weight: bold; color: #ffc107;">Kec: 2</span>
        <button onclick="ubahKecepatan(1)" class="btn btn-secondary btn-sm">+ Cepat</button>
    </div>

    <div id="prompterContent" style="max-width: 800px; margin: 100px auto 350px auto; font-size: 26pt; line-height: 1.9; text-align: justify; font-family: 'Segoe UI', Arial, sans-serif; padding: 0 10px;">
        </div>
</div>

<script>
    let scrollInterval = null;
    let isScrolling = false; // Memperbaiki variabel kontrol yang tertinggal
    let scrollSpeed = 2;

    async function generateKhutbah() {
        const category = document.getElementById('category').value;
        const topic = document.getElementById('topic').value;
        const duration = document.getElementById('duration').value;
        const language = document.getElementById('language').value;
        const outputDiv = document.getElementById('output');

        if (!topic) {
            alert('Silakan masukkan tema/topik khutbah terlebih dahulu!');
            return;
        }

        outputDiv.innerHTML = `<div class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-success fw-bold">Sedang merangkai naskah terbaik... Mohon tunggu sebentar...</p>
        </div>`;

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic, duration, language, category })
            });

            const data = await response.json();
            
            if (data.success) {
                outputDiv.classList.remove('text-muted');
                outputDiv.innerHTML = data.khutbah;
            } else {
                outputDiv.innerHTML = `<span class="text-danger">Gagal menghasilkan naskah: ${data.error || 'Terjadi kesalahan sistem.'}</span>`;
            }
        } catch (error) {
            outputDiv.innerHTML = `<span class="text-danger">Terjadi kesalahan koneksi ke server. Pastikan API Key sudah benar.</span>`;
            console.error(error);
        }
    }

    function copyToClipboard() {
        const outputText = document.getElementById('output').innerText;
        navigator.clipboard.writeText(outputText).then(() => {
            alert('Naskah khutbah berhasil disalin ke memori laptop!');
        }).catch(err => {
            alert('Gagal menyalin teks.');
        });
    }

    function printKhutbah() {
        const khutbahContent = document.getElementById('output').innerHTML;
        const tema = document.getElementById('topic').value || 'Naskah Khutbah';
        const printWindow = window.open('', '_blank');
        
        printWindow.document.write(`
            <html>
            <head>
                <title>${tema}</title>
                <style>
                    body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; line-height: 1.8; font-size: 14pt; color: #000; white-space: pre-line; }
                    .arabic { direction: rtl; font-family: 'Traditional Arabic', 'Scheherazade New', serif; font-size: 18pt; }
                </style>
            </head>
            <body>
                ${khutbahContent}
                <script>
                    window.onload = function() {
                        window.print();
                        window.onafterprint = function() { window.close(); }
                    }
                <\/script>
            </body>
            </html>
        `);
        printWindow.document.close();
    }

    /* === LOGIKA FUNGSI JAVASCRIPT TELEPROMPTER === */
    function bukaTeleprompter() {
        const naskahAsli = document.getElementById('output').innerHTML;
        const prompterContent = document.getElementById('prompterContent');
        const prompterOverlay = document.getElementById('prompterOverlay');

        if (document.getElementById('output').classList.contains('text-muted')) {
            alert('Silakan hasilkan naskah terlebih dahulu sebelum masuk Mode Mimbar!');
            return;
        }

        prompterContent.innerHTML = naskahAsli;
        prompterOverlay.style.display = 'block';
        document.body.style.overflow = 'hidden'; 
        prompterOverlay.scrollTop = 0;
    }

    function tutupTeleprompter() {
        stopScroll();
        document.getElementById('prompterOverlay').style.display = 'none';
        document.body.style.overflow = 'auto'; 
    }

    function toggleScroll() {
        if (isScrolling) {
            stopScroll();
        } else {
            startScroll();
        }
    }

    function startScroll() {
        const overlay = document.getElementById('prompterOverlay');
        const btn = document.getElementById('btnPlayPause');
        
        isScrolling = true;
        btn.innerText = "Jeda ⏸";
        btn.classList.replace('btn-success', 'btn-warning');

        scrollInterval = setInterval(() => {
            overlay.scrollTop += 1;
        }, 40 / scrollSpeed); 
    }

    function stopScroll() {
        const btn = document.getElementById('btnPlayPause');
        isScrolling = false;
        btn.innerText = "Mulai ▶";
        btn.classList.replace('btn-warning', 'btn-success');
        clearInterval(scrollInterval);
    }

    function ubahKecepatan(nilai) {
        scrollSpeed += nilai;
        if (scrollSpeed < 1) scrollSpeed = 1;
        if (scrollSpeed > 10) scrollSpeed = 10;
        
        document.getElementById('speedIndicator').innerText = `Kec: ${scrollSpeed}`;
        
        if (isScrolling) {
            clearInterval(scrollInterval);
            startScroll();
        }
    }
</script>
</body>
</html>
