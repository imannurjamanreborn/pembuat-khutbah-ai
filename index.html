<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhatibAI - Pembuat Khutbah Otomatis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .khutbah-output { background-color: #fff; border-left: 5px solid #198754; padding: 20px; white-space: pre-line; }
        
        /* PERBAIKAN TOTAL MODE CETAK */
        @media print {
            /* Sembunyikan elemen dekorasi yang tidak penting secara aman */
            .text-center.mb-5, .col-md-5, .btn-outline-secondary, .btn-primary {
                display: none !important;
            }
            
            /* Ubah latar belakang body jadi putih bersih */
            body {
                background-color: #fff !important;
            }

            /* Paksa kotak naskah khutbah melebar penuh dan langsung mulai di halaman 1 paling atas */
            #output {
                position: fixed !important; /* Trik agar mengunci posisi paling atas kertas */
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
                border-left: none !important;
                font-size: 14pt;
                line-height: 1.8;
                color: #000;
                white-space: pre-line;
                background-color: #fff !important;
            }
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold text-success">🕌 KhatibAI</h1>
        <p class="text-muted">Generator Khutbah Otomatis Berbasis Rukun & Syariat</p>
    </div>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="card p-4">
                <h4 class="mb-3 text-secondary">Pengaturan Khutbah</h4>
                
                <div class="mb-3">
                    <label class="form-label">Tema / Topik Khutbah</label>
                    <input type="text" id="topic" class="form-control" placeholder="Contoh: Ketakwaan, Silaturahmi">
                </div>

                <div class="mb-3">
                    <label class="form-label">Durasi Khutbah</label>
                    <select id="duration" class="form-select">
                        <option value="pendek">Pendek (7 - 10 Menit)</option>
                        <option value="sedang" selected>Sedang (10 - 15 Menit)</option>
                        <option value="panjang">Panjang (15 - 20 Menit)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Bahasa Pengantar (Isi)</label>
                    <select id="language" class="form-select">
                        <option value="Indonesia yang santun dan menyentuh hati" selected>Bahasa Indonesia (Santun)</option>
                        <option value="Jawa Kromo (Alus)">Bahasa Jawa (Kromo Alus)</option>
                        <option value="Sunda Lemes">Bahasa Sunda (Lemes)</option>
                    </select>
                </div>

                <button onclick="generateKhutbah()" class="btn btn-success w-100 fw-bold py-2">Hasilkan Khutbah ✨</button>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="text-secondary m-0">Naskah Khutbah</h4>
                    <button onclick="copyToClipboard()" class="btn btn-outline-secondary btn-sm">Salin Teks</button>
                    <button onclick="printKhutbah()" class="btn btn-primary btn-sm">Cetak / PDF 🖨️</button>
                </div>
                
                <div id="output" class="khutbah-output text-muted">
                    Silakan masukkan tema dan klik "Hasilkan Khutbah" untuk membuat teks otomatis.
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function generateKhutbah() {
        const topic = document.getElementById('topic').value;
        const duration = document.getElementById('duration').value;
        const language = document.getElementById('language').value;
        const outputDiv = document.getElementById('output');

        if (!topic) {
            alert('Silakan masukkan tema/topik khutbah terlebih dahulu!');
            return;
        }

        outputDiv.innerHTML = `<div class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-success fw-bold">Sedang merangkai naskah khutbah terbaik... Mohon tunggu sebentar...</p>
        </div>`;

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic, duration, language })
            });

            const data = await response.json();
            
            if (data.success) {
                outputDiv.classList.remove('text-muted');
                outputDiv.innerHTML = data.khutbah;
            } else {
                outputDiv.innerHTML = `<span class="text-danger">Gagal menghasilkan khutbah: ${data.error || 'Terjadi kesalahan sistem.'}</span>`;
            }
        } catch (error) {
            outputDiv.innerHTML = `<span class="text-danger">Terjadi kesalahan koneksi ke server. Pastikan API Key sudah benar.</span>`;
            console.error(error);
        }
    }

    function copyToClipboard() {
        const outputText = document.getElementById('output').innerText;
        navigator.clipboard.writeText(outputText).then(() => {
            alert('Naskah khutbah berhasil disalin ke memori laptop!');
        }).catch(err => {
            alert('Gagal menyalin teks.');
        });
    }

    function printKhutbah() {
        window.print();
    }
</script>
</body>
</html>
